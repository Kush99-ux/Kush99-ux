          <path d="M 0,-14 V 10.5 L 6.8,8.2 L 8,-14 Z" fill="#EF652A"/>
          <path d="M 0,-6 H -3.5 L -3.7,-9 H 0 V -11.5 H -6.2 L -5.6,-2 H 0 Z" fill="#FFFFFF"/>
        </g>
        <g transform="translate(11, -2)">
          <path d="M -9,-12 L 9,-12 L 7,8 L 0,11 L -7,8 Z" fill="#1572B6"/>
          <path d="M 0,-12 V 9.5 L 5.8,7.7 L 7,-12 Z" fill="#33A9DC"/>
          <path d="M 0,-5 H 3.2 L 2.8,-2 H 0 V 0 H 2.4 L 2,3.5 L 0,4.2 L -2,3.5 L -2.2,1 H -4 L -3.8,5 L 0,6.2 Z" fill="#FFFFFF"/>
        </g>
      </g>
      <text x="60" y="80" class="matrix-label">HTML/CSS</text>
    </g>
  </g>
</g>


