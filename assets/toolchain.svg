      <g transform="translate(60, 36)" class="vector-icon" stroke="#336791" stroke-width="1.5" fill="none">
        <path d="M -14,-10 C -14,-14 14,-14 14,-10 C 14,-6 -14,-6 -14,-10 Z" fill="#336791" fill-opacity="0.2"/>
