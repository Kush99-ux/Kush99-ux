<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" role="img" aria-label="Technical Toolchain Matrix Dashboard">
<title>Technical Toolchain Matrix Dashboard</title>
<desc>High-density engineering toolchain capability matrix matching a bare-metal instrumentation dashboard with unified cell grids and inline vector iconography.</desc>

<defs>
  <style>
    .matrix-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #7DF9FF; letter-spacing: 1.5px; text-transform: uppercase; text-anchor: middle; }
    .matrix-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #FFFFFF; opacity: 0.85; text-anchor: middle; }
    .matrix-cell { fill: #091A34; stroke: rgba(125,249,255,0.15); stroke-width: 1px; transition: all 0.25s ease-in-out; cursor: pointer; }
    .matrix-row:hover .matrix-cell { stroke: rgba(125,249,255,0.25); }
    .cell-trigger { pointer-events: all; }
    .cell-trigger:hover .matrix-cell { fill: #0D264A; stroke: #00D4FF; stroke-width: 1.25px; }
    .cell-trigger:hover .matrix-label { fill: #7DF9FF; opacity: 1; }
    .cell-trigger:hover .vector-icon { filter: url(#matrixGlow); }
  </style>

  <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.5" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <filter id="sysLed" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.5" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>

  <linearGradient id="instrumentGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060D1A"/>
    <stop offset="100%" stop-color="#0A1424"/>
  </linearGradient>
</defs>

<rect width="1200" height="700" fill="#07111F"/>

<g opacity="0.03" stroke="#00D4FF" stroke-width="0.5" fill="none">
  <path d="M 0,35 L 1200,35 M 0,70 L 1200,70 M 0,105 L 1200,105 M 0,140 L 1200,140 M 0,175 L 1200,175 M 0,210 L 1200,210 M 0,245 L 1200,245 M 0,280 L 1200,280 M 0,315 L 1200,315 M 0,350 L 1200,350 M 0,385 L 1200,385 M 0,420 L 1200,420 M 0,455 L 1200,455 M 0,490 L 1200,490 M 0,525 L 1200,525 M 0,560 L 1200,560 M 0,595 L 1200,595 M 0,630 L 1200,630 M 0,665 L 1200,665" />
  <path d="M 60,0 L 60,700 M 120,0 L 120,700 M 180,0 L 180,700 M 240,0 L 240,700 M 300,0 L 300,700 M 360,0 L 360,700 M 420,0 L 420,700 M 480,0 L 480,700 M 540,0 L 540,700 M 600,0 L 600,700 M 660,0 L 660,700 M 720,0 L 720,700 M 780,0 L 780,700 M 840,0 L 840,700 M 900,0 L 900,700 M 960,0 L 960,700 M 1020,0 L 1020,700 M 1080,0 L 1080,700 M 1140,0 L 1140,700" />
</g>

<g transform="translate(60, 20)">
  <circle cx="10" cy="10" r="3" fill="#00FF66" filter="url(#sysLed)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="22" y="13" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#00FF66" font-weight="bold" letter-spacing="1">MATRIX_RUNNING</text>
  <text x="200" y="13" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" fill="#00D4FF" opacity="0.4">UNIT_CHANNELS: ENABLED</text>
  <text x="1080" y="13" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" fill="#00D4FF" opacity="0.4" text-anchor="end">SWIPEE_CLK: LOCK</text>
</g>


<g transform="translate(360, 65)">
  <text x="240" y="20" class="matrix-title">Embedded Hardware Architecture</text>
  
  <g class="matrix-row" transform="translate(0, 32)">
    <rect width="480" height="95" fill="url(#instrumentGrad)" stroke="rgba(125,249,255,0.15)" stroke-width="1" rx="4"/>
    
    <g class="cell-trigger" transform="translate(0, 0)">
      <rect width="120" height="95" fill="transparent" class="matrix-cell"/>
      <g transform="translate(60, 36)" class="vector-icon" fill="none" stroke="#00D4FF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-16" y="-16" width="32" height="32" rx="2" fill="#0A182B" stroke-width="1.5"/>
        <circle cx="-10" cy="-10" r="1" fill="#7DF9FF" stroke="none"/>
        <path d="M -21,-10 H -16 M -21,-5 H -16 M -21,0 H -16 M -21,5 H -16 M -21,10 H -16 M 16,-10 H 21 M 16,-5 H 21 M 16,0 H 21 M 16,5 H 21 M 16,10 H 21 M -10,-21 V -16 M -5,-21 V -16 M 0,-21 V -16 M 5,-21 V -16 M 10,-21 V -16 M -10,16 V 21 M -5,16 V 21 M 0,16 V 21 M 5,16 V 21 M 10,16 V 21"/>
        <text x="0" y="3" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#FFFFFF" text-anchor="middle" stroke="none" letter-spacing="0.2">ARM</text>
      </g>
      <text x="60" y="80" class="matrix-label">STM32</text>
    </g>

    <g class="cell-trigger" transform="translate(120, 0)">
      <rect width="120" height="95" fill="transparent" class="matrix-cell"/>
      <g transform="translate(60, 36)" class="vector-icon">
        <path d="M -15,-16 H 5 L 15,-6 V 16 H -15 Z" fill="#00599C"/>
        <path d="M 5,-16 V -6 H 15 Z" fill="#00447B"/>
        <text x="0" y="6" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">C</text>
      </g>
      <text x="60" y="80" class="matrix-label">Embedded C</text>
    </g>

    <g class="cell-trigger" transform="translate(240, 0)">
      <rect width="120" height="95" fill="transparent" class="matrix-cell"/>
      <g transform="translate(60, 36)" class="vector-icon" stroke="#7DF9FF" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M -20,-8 H -4 L 4,0 H 20"/>
        <path d="M -20,8 H -10 L -2,0 H 20" stroke="#00D4FF"/>
        <circle cx="-4" cy="-8" r="1.5" fill="#07111F" stroke="#7DF9FF" stroke-width="1"/>
        <circle cx="-10" cy="8" r="1.5" fill="#07111F" stroke="#00D4FF" stroke-width="1"/>
        <path d="M -18,-15 H -13 V -11 H -8 V -15 H -3" stroke="#00D4FF" stroke-width="1"/>
      </g>
      <text x="60" y="80" class="matrix-label">UART / I2C</text>
    </g>

    <g class="cell-trigger" transform="translate(360, 0)">
      <rect width="120" height="95" fill="transparent" class="matrix-cell"/>
      <g transform="translate(60, 36)" class="vector-icon" stroke="#00D4FF" stroke-width="1.2" fill="none">
        <circle cx="0" cy="2" r="4" fill="#00D4FF"/>
        <circle cx="-14" cy="-8" r="3" fill="#07111F" stroke="#7DF9FF"/>
        <circle cx="14" cy="-8" r="3" fill="#07111F" stroke="#7DF9FF"/>
        <circle cx="0" cy="14" r="3" fill="#07111F" stroke="#7DF9FF"/>
        <line x1="-3" y1="-1" x2="-11" y2="-6"/>
        <line x1="3" y1="-1" x2="11" y2="-6"/>
        <line x1="0" y1="6" x2="0" y2="11"/>
      </g>
      <text x="60" y="80" class="matrix-label">IoT Sensors</text>
    </g>
  </g>
</g>


