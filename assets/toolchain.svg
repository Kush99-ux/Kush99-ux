      <g transform="translate(60, 36)" class="vector-icon">
        <path d="M -5,-19 C -3,-14 -9,-11 -5,-5 M 1,-21 C 4,-15 -2,-12 2,-6 M 6,-18 C 8,-13 3,-10 8,-5" fill="none" stroke="#E61F24" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M -12,-2 H 10 C 12,-2 13,0 11,3 C 8,6 3,10 -3,10 C -9,10 -13,6 -12,-2 Z" fill="#F8981D"/>
